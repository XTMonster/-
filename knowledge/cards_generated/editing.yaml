- id: gen_edit_0055
  domain: editing
  title: 切镜过频的节奏上限
  content: 若场景切换过频且没有任何动作被不间断地延续，影片会因不断跳换地点而令观众烦躁；控制切镜密度，保留至少一条连续动作线作为节奏锚点。
  keywords:
  - 切镜频率
  - 连续动作
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: 烦躁
  tags:
  - 剪辑密度
  topic: editing
  quote: |-
    If the scene changes too often and no movement is carried on without a break, the play may irritate us by its nervous jerking from place to place.
  source_ref:
    url: https://www.gutenberg.org/cache/epub/15383/pg15383.txt
