- id: gen_edit_0038
  domain: editing
  title: 呼吸式段落结构
  content: 有效段落采用"短—短—短—长"的呼吸结构：先用连续短镜积累压力，再用一个长镜释放与沉淀，避免单一节奏贯穿整段。
