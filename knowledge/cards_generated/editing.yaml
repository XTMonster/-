- id: gen_edit_0057
  domain: editing
  title: 情绪反应作为注意诱因
  content: 若想让观众注意某元素，可先触发其情绪反应（希望、恐惧、愤慨等），再由情绪把注意拉向该元素；注意起点仍在画面外的事件上。
  keywords:
  - 本能
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: 激动
  tags:
  - 情绪引导
  - 注意力
  topic: editing
  quote: |-
    everything which stirs up hope or fear, enthusiasm or indignation, or any strong emotional excitement will get control of our attention
  source_ref:
    url: https://www.gutenberg.org/cache/epub/15383/pg15383.txt
    title: 'The Photoplay: A Psychological Study'
    author: Hugo Münsterberg
