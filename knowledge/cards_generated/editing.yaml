- id: gen_edit_0059
  domain: editing
  title: 观众须接受影片提示
  content: 若观众以科学、时尚或职业等外在兴趣观看，就与影片无关；只有接受编剧与制作者预设的注意力提示，才算真正进入观影状态。
  keywords:
  - 注意力提示
  - 观影态度
  - 预设
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 注意力引导
  - 观影心理
  topic: editing
  quote: |-
    we must accept those cues for our attention which the playwright and the producers have prepared for us
