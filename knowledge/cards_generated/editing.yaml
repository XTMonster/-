- id: gen_edit_0054
  domain: editing
  title: 节奏靠相对变化
  content: 节奏的关键不是单个镜头的绝对长度，而是镜头间的相对变化：持续快切会让观众麻木，持续长镜会让观众失焦，必须让长短交替出现。
  keywords:
  - 长短交替
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 剪辑
  topic: editing
  quote: |-
    节奏的关键不是绝对长度，而是**相对变化**：一直快观众会麻木，一直慢观众会失焦。
