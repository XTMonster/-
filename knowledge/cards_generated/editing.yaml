- id: gen_edit_0042
  domain: editing
  title: 电影与戏剧的美学比较
  content: 比较电影与戏剧时，应从模仿自然的角度出发：戏剧在舞台上呈现真实血肉之躯、真实运动，事件独立于观众的主观注意、记忆与想象而客观进行；电影则失去色彩、声音、深度与自然运动，且事件被观众的主观心理活动重塑。
  keywords:
  - 模仿自然
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags: []
  topic: editing
  quote: |-
    The color of the world has disappeared, the persons are dumb, no sound reaches our ear.
