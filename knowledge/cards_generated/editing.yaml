- id: gen_edit_0040
  domain: editing
  title: 剪辑点的两种驱动力
  content: 每个剪辑点只由一种动力决定：信息驱动（观众缺信息时切、信息给完即切走）或情绪驱动（情绪未落地则留、情绪落地立刻切）；不要在同一剪辑点上混用两种动力。
  keywords:
  - 信息驱动
  - 情绪驱动
