- id: gen_edit_0056
  domain: editing
  title: 有意注意引导观看
  content: 若想让观众按预设目标观看，先在心里确定要聚焦的对象，再据此选择画面内容，忽略与目标无关的元素。
  keywords:
  - 预设目标
  - 选择
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 视觉引导
  - 调度
  topic: editing
  quote: |-
    We call it voluntary if we approach the impressions with an idea in our mind as to what we want to focus our attention on.
  source_ref:
    url: https://www.gutenberg.org/cache/epub/15383/pg15383.txt
    title: 'The Photoplay: A Psychological Study'
