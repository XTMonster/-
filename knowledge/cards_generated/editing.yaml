- id: gen_edit_0002
  domain: editing
  title: 交叉剪辑的节奏差
  content: 两条线交替剪辑时，用节奏差区分叙事线：让一条线保持慢速作为基准，另一条线用快速剪辑形成干扰，速度反差越大，观众越容易分辨当前处于哪条线。
  keywords:
