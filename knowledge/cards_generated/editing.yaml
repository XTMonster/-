- id: gen_edit_0058
  domain: editing
  title: 法庭陈述式闪回
  content: 若用闪回替代角色在法庭上的口头陈述，在角色开口瞬间让法庭场景淡出进入往事，讲完关键点后再滑回法庭收尾；此法比记忆触发式闪回艺术性低。
  keywords:
  - 淡出
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 转场
  topic: editing
  quote: |-
    at the moment when she opens her mouth the courtroom disappears and fades into the scene in which the love adventure began.
  source_ref:
