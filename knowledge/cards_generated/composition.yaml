- id: gen_comp_0193
  domain: composition
  title: 主体分离的四条手段
  content: 让主体从背景中分离，可用明暗差（主体与背景至少相差两档）、色彩差（互补色或明度差）、焦点差（背景失焦）、运动差（主体动背景静或反之）四种手段；四条中至少满足两条，否则主体会糊在背景里。
  keywords:
  - 图底分离
  - 明暗差
  - 色彩差
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 构图
  - 层次
  topic: camera_angle
  quote: |-
    四条可执行的分离手段：**明暗差**（主体与背景至少相差两档）、**色彩差**（互补或明度差）、**焦点差**（背景失焦）、**运动差**（主体动、背景静，或反之）。**四条中至少要满足两条**，否则主体会糊在背景里。
