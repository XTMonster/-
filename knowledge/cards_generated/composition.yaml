  title: 三平面层次检查法
  content: 层次感来自前景—中景—背景三个平面；可执行检查是能否在同一画面里指出这三个平面各自是什么。若只有两个平面，用前景遮挡（树枝、门框、人物肩部）补出第三层，这是最便宜也最有效的加深手段。
