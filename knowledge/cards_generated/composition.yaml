- id: gen_comp_0194
  domain: composition
  title: 负空间方向随主体朝向
  content: 负空间应开在主体朝向的一侧；若把负空间留在主体背后，画面读作无法前进，仅在剧本需要受阻感时使用，否则与向前叙事矛盾。
