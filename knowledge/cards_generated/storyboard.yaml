- id: gen_story_0025
  domain: storyboard
  title: 悬念与期待的区别
  content: 写悬念时区分两种观众心理：期待是希望某事发生，悬念是害怕某事发生；只有让观众产生情绪压力（而非仅角色紧张）才是真正的悬念。
  keywords:
  - 观众情绪
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: 恐惧
  tags:
  - 观众心理
  topic: storyboard
  quote: |-
    expectation is the hope that something will happen; _suspense is the fear that something may happen_.
