- id: gen_cine_0103
  domain: cinematography
  title: 黑是减量非能量
  content: 黑色不是与彩色并列的主动能量，而是一个“负量”，只能通过与原始光的对比被辨识；反射光由显出的色彩加上未被吸收的残余白光组成，布光时应把黑理解为对光的削减而非一种颜色。
  keywords:
  - 对比
  rules: []
  parameters: {}
  examples: []
  related: []
  engine_support: ''
  emotion: ''
  tags:
  - 黑位
  - 色彩理论
  topic: lighting
  quote: |-
    black is not itself an active energy analogous to colour, but is a minus quantity distinguishable by contrast with the original light
