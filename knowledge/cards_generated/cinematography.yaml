- id: gen_cine_0093
  domain: cinematography
  title: 过肩镜头的成立条件
  content: 过肩镜头（OTS）需同时满足三点：前景人物的肩部或后脑占画面一侧的1/4到1/3；焦点落在后景人物眼睛上、前景人虚化；机位高度接近前景人物眼高，以形成“从其肩后看”的视点。
