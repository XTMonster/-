- id: gen_cine_0100
  domain: cinematography
  title: 24mm 强透视交代环境
  content: 需要交代远景与环境、强调空间纵深时用 24 mm：透视强、空间被拉深；但人脸会被拉宽，靠近画面边缘的物体明显变形，避免用它拍人物近景。
