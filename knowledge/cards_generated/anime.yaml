- id: gen_anime_0077
  domain: anime
  title: 演出三要素
  content: 二维动画的场面调度（演出）需同时成立三件事：构图留出下一次运动的空间（主体不顶格）、台词/动作/镜头不同时结束（错开2–6格制造层次）、用小物（头发、衣角、雨的斜度）说明风与情绪；三者齐备画面才有信息量，不会显得在等台词。
  keywords:
  - 构图呼吸
  - 时间错位
  - 小物表演
