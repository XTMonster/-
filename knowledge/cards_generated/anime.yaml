- id: gen_anime_0146
  domain: anime
  title: 用3D的四个判断条件
  content: 判断一个镜头是否用3D，看四条：需要严格透视与重复使用（机械、道具、车辆）；需要连续运动且不允许形变（旋转、环绕、升降）；需要与实拍或复杂摄影结合（虚拟摄影机、LED背景）；需要在多镜头间保持完全一致的形状（量产机体、固定布景）。命中两条以上，用3D通常比手绘便宜。
  keywords:
  - 3D判断
  - 透视
  - 重复使用
