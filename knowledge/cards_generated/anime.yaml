- id: gen_anime_0427
  domain: anime
  title: 录音前先定动作
  content: 进录音棚前必须先把每场戏里每个角色的动作确定下来；通常在做分镜时就完成，若尚未到分镜阶段，则至少要把剧本吃透，以便现场引导配音演员。
