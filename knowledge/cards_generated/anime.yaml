  content: 验收3D与手绘混合段落时，逐项核对四类可判定断层：线条/阴影不一致的风格断层、3D用1格而手绘用2格的时间断层、透视基准不同的空间断层、3D细节远多于手绘的密度断层；任一出现即说明观众能指出换技术了。
