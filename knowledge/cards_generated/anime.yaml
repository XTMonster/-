  title: 视觉一致性四项检查
  content: 跨集制作时用四项可执行检查守住视觉一致性：色板控制在12–20色且按时段分明；同一场景复用同一份LAYOUT作为空间基准；光的类型与情绪绑定并重复使用；符号化表现不得替代表演。任一项漂移都会让观众觉得"这一集感觉不对"。
  keywords:
  - 一致性检查
  - 色板
  - LAYOUT
  rules: []
  parameters: {}
