# P14-1 来源清单（执行文档 v1.4 §2.3c）——**人工维护，机器只读**。
#
# 字段：url / title / author / license / domain / mode（＋选填 note / genre / theme /
# retrieved_at）。`license` 必须在白名单内（CC0 / CC-BY / CC-BY-SA / PublicDomain /
# OwnWork / ExplicitPermission / PersonalStudy），否则
# `tools/kb_fetch/validate_licenses.py` 一律拒收。`PersonalStudy` 是 v1.5 为
# **个人学习用**的现代教材/论文/讲义新增的一档：它与"拿到授权"不是一回事，
# 单独记名，便于以后真要对外分发时一眼筛出来（见 docs/knowledge/LICENSES.md）。
#
# 两类来源走**同一**管线，只有第 1 步分叉：
#   * mode: http   —— 公有领域文本（Project Gutenberg，逐本核过标题与作者）；
#   * mode: manual —— 自撰笔记（正文在 `knowledge/source_notes/`，许可 OwnWork，
#                     `sha256` 就是笔记正文的哈希，可独立复算）。
# 许可与归属的逐条声明见 `docs/knowledge/LICENSES.md`。
#
# `theme` 只用于 K5（六个主题配额的诊断计数），不参与检索。

