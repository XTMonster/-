# P14-1 来源清单（执行文档 v1.4 §2.3c）——**人工维护，机器只读**。
#
# 字段：url / title / author / license / domain / mode（＋选填 note / genre / theme /
# chunk_budget）。`license` 必须在白名单内（CC0 / CC-BY / CC-BY-SA / PublicDomain /
# OwnWork / ExplicitPermission / PersonalStudy），否则
# `tools/kb_fetch/validate_licenses.py` 一律拒收。
#
# **2026-10-01 用户裁决：「理论不要自己写，要别人写的——专业的事情交给专业的人做」。**
# 因此 27 条 `mode: manual`（`repo://knowledge/source_notes/*.md`，`license: OwnWork`）
# 已**全部移除**：它们产出的 671 张自撰卡是"本项目自己写的理论"。空出来的域用
# **他人著作**补：Project Gutenberg 的公有领域教材/实务书（`license: PublicDomain`）
# 与 MIT OpenCourseWare 讲义（`license: CC-BY-NC-SA`）。判据是机器门
# `tools/knowledge/authorship_report.py`（生成卡的 `source_ref.url` 必须是 http/https）。
# 逐条归属见 `docs/knowledge/LICENSES.md` 与 `docs/knowledge/MODERN_SOURCES.md`。
#
# 检索与抓取纪律：只走 http/https；先过 `fetch.py` 的 robots 门（取不到 robots.txt 就拒收），
# 同域限速，重定向每一跳重新过门。实测不可达/被 robots 拒的域名（pressbooks.pub、
# milnepublishing.geneseo.edu、jamsjournal.com、en.wikisource.org、archive.org、
# upload.wikimedia.org、doi.org）**一律不收录**。

