  # 而 §2.3b 把 L3 定义成"**拉片/复盘/影评**"。现有 L3 里最接近的是 Animation Studies
  # （161 篇 CC-BY）与 StudioBinder 的 6 篇逐片分析；**对具体影片的镜头/场面分析**
  # 这一档仍然很薄。BFI 的 Sight & Sound 是这一档最对口的英文来源。
  #
  # 抓取纪律（实测，逐条可复算）：
  #   1. `www.bfi.org.uk/robots.txt` = **404** ⇒ 按 RFC 9309「没有规则 ⇒ 放行」
  #      （`fetch.robots_allows` 返回 True）；
  #   2. 枚举走 `/site-map`（272 条同域链接）与 `/articles/type/{reviews,features}`
  #      （各 30 条），**不用 sitemap.xml**——它是自引用死循环；
  #   3. 每条都过仓库自己的抓取门并抽正文：35/35 抓通，正文 5.2k–20.9k 字符；
  #   4. 剔除讣告/影展新闻/订阅页，只留**逐片**的评论与制作分析。
