# **已停用（2026-10-01 用户裁决："别用本地模型了"）。**
#
# 本文件是 §21.10「真实模型联调」那次运行的**历史记录**，保留是为了让证据可复现，
# 不再是一条可跑通的验收路径：`ollama pull` 把 C 盘吃到过 4.1 GB，且
# `qwen3-vl:30b` 加载即 `HTTP 500 token repeat limit`（安装 blob 的 sha256 与
# manifest 一致，文件没坏，是运行不了）。
# 现在的真实模型走**云端**：`fixtures/local_sidecar.config.yaml` 的 sidecar 通道 +
# `provider: glm`（智谱），或 `llm.provider: deepseek`。见执行文档 §4.4。
#
# 下面是**当时**用本地 OpenAI 兼容端点（Ollama）跑真实模型的配置样例。
# 用法：
#   $env:BLOCKDIRECTOR_CONFIG="<repo>\fixtures\local_model.config.yaml"
#   blender --background --factory-startup --python tools/run_headless.py -- ^
#       --sidecar --build --script fixtures\coffee.fountain --wall 1800 --out <dir>
#
# 实测（2026-09，qwen3-vl:30b / Ollama）：plan 一次约 90 秒（2110 输出 token），
# 单镜草案约 29 秒。因此 sidecar_timeout_s 必须放大——默认 120 秒会被这张计划
# 撞到（不是失败，是"刚好卡在边界"）。
llm:
  transport: direct
  provider: local
  # 本地 qwen3-vl:30b 已停用（用户裁决 2026-10-01）；本文件现在是历史记录，
  # 如果要重跑这条直连通道，把 model/base_url 换成云端端点即可。
  model: "glm-4.7-flash"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: ""
  sidecar_timeout_s: 600
  max_tokens: 8192        # 思维模型（qwen3）会把预算花在 reasoning 上；4096 实测会被截断
  temperature_plan: 0.7

rag:
  enabled: true
  # 与 `fixtures/local_sidecar.config.yaml` 同一口径（v1.4 §2.3）：默认请求**超图**；
  # 不可用时由检索器自己降级为 bm25 并在 `knowledge_trace.json` 标 `degraded`。
  # 写死 bm25 会让 `/v1/retrieve` 永不发生 ⇒ `retrieval_call` 事件为空 ⇒ Q5 没分母。
  backend: hypergraph

budget:
  max_llm_calls_per_scene_formula: "shots * 6"
  max_cost_usd: 5.0
  max_wall_minutes: 30

delivery:
  preset: hd16x9
  appearance: clay
  render_backend: workbench
