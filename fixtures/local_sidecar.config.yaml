# **文件名里的 "local" 是历史遗留（2026-10-01 用户裁决："别用本地模型了"）。**
# sidecar 这条**通道**仍然是一等公民，只是上游不再是 Ollama：现在是云端
# `provider: glm`（智谱）/ `deepseek`。下面 `model:` 一行已经换成当前可跑的写法；
# §21.10 那次本地运行（`qwen3-vl:30b`）作为历史证据保留在配置注释里。
#
# 走 sidecar 的真实模型配置样例（§2.4 的形态 ②）。
#
# 先用 tools/sidecar_server.py 起服务，再让插件按 sidecar 模式调用：
#   云端上游（推荐）：把插件指向 sidecar，sidecar 转发到智谱：
#   python tools/sidecar_server.py --port 8899 \
#       --upstream https://open.bigmodel.cn/api/paas/v4 --model glm-4.7-flash
#   历史（已停用）：--upstream http://127.0.0.1:11434 --model qwen3-vl:30b
#   $env:BLOCKDIRECTOR_CONFIG="<repo>\fixtures\local_sidecar.config.yaml"
#   blender --background --factory-startup --python tools/run_headless.py -- \
#       --sidecar --build --script fixtures\script_simple.fountain --wall 3600 \
#       --llm-timeout 900 --out <dir>
#
# 为什么要 sidecar：Ollama 的 OpenAI 兼容层**不接受** num_ctx/think，实测默认
# num_ctx=4096 会把思维链连同工具调用一起截断（finish_reason=length）。这些
# 供应商差异由 sidecar 承担，插件只依赖 §2.5 的线协议。
llm:
  transport: sidecar
  sidecar_url: "http://127.0.0.1:8899"
  sidecar_token: ""
  sidecar_timeout_s: 900
  provider: local
  # 本地 qwen3-vl:30b 已停用（加载即 `HTTP 500 token repeat limit`）；
  # 这条通道现在的上游是云端 GLM（用户裁决：用智谱 glm-4.7 一路的模型）。
  model: "glm-4.7-flash"
  base_url: ""
  api_key: ""
  max_tokens: 8192

rag:
  enabled: true
  # v1.4 §2.3：**默认后端 = 超图**（跑在 sidecar 的 `/v1/retrieve` 上）。
  # 这里曾经写 `bm25`——那是插件进程里的内置卡片检索，**根本不发 `/v1/retrieve`**，
  # 于是 ① L1/L2 的 `forbid` 禁忌一栏从来没进过提示词、② 审计里一条
  # `retrieval_call` 都没有（long14 六十四镜实测 `retrieval_calls: 0`），
  # §4.1b 的 Q5 因此**结构性**没有分母。sidecar 不可用/没有索引时会**自己**降级为
  # bm25 并在 `knowledge_trace.json` 里标 `degraded`——降级可以，静默不行。
  backend: hypergraph

budget:
  max_llm_calls_per_scene_formula: "shots * 8"
  max_cost_usd: 5.0
  max_wall_minutes: 60

# v1.3 §3.6：剧本里写了"约 30 名路人"这类声明时才需要打开群众代理。
# 默认是关的（对象数与关键帧数都会明显上升）。
crowd:
  enabled: true
  max_instances: 40

delivery:
  preset: hd16x9
  appearance: clay
  render_backend: workbench
