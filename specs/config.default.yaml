# BlockDirector 默认配置（执行文档 v1.2 §21.5）
# 本文件由 block_director.contracts.config.dump_default_yaml() 生成，请勿手工漂移；
# 修改默认值请改 block_director/contracts/config.py 后重新生成。

config_version: 1.4.0
llm:
  transport: auto
  sidecar_url: http://127.0.0.1:8765
  sidecar_token: ''
  sidecar_timeout_s: 120.0
  provider: openai
  model: gpt-4o
  api_key: ''
  base_url: ''
  timeout_s: 300.0
  max_tokens: 0
  temperature_plan: 0.7
  temperature_repair: 0.2
  trace_prompts: true
  trace_max_chars: 8000
  thinking_level: 'off'
rag:
  enabled: true
  backend: hypergraph
  embedder: bge-small-zh-v1.5
  top_k: 15
  rule_top_k: 8
  max_tokens_per_call: 50000
  plan_prefetch_tokens: 60000
  cases_backend: lightrag
  cases_top_k: 3
  extract_concurrency: 16
orchestration:
  mode: plan_structured
  max_repair_attempts: 2
  react_max_steps: 6
  repair_max_turns: 10
  context_window_tokens: 32000
  max_shots: 0
  self_review: true
  draft_candidates: 1
audit:
  level: standard
  human_gate_on_plan: true
  human_gate_on_axis_violation: true
  rules_disabled: []
budget:
  max_llm_calls_per_scene_formula: shots * 8 + 40
  max_llm_calls_ceiling: 200
  max_cost_usd: 5.0
  max_wall_minutes: 120.0
  tokens_per_call_allowance: 7000
  max_tokens_ceiling: 4000000
brief:
  enabled: true
  max_tokens: 1200
scene:
  extent_m: 12.0
crowd:
  enabled: null
  max_instances: 40
  seed: 0
  mode: walk
  height: 1.65
  spacing: 1.6
vfx:
  enabled: true
character:
  total_height: 1.7
  head_ratio: 0.37
  torso_ratio: 0.44
  leg_ratio: 0.19
  eye_r: 0.035
  eye_dx: 0.11
  eye_protrusion: 0.015
  neck_gap: 0.0
  eye_color: '#101010'
  label_size: 0.15
  label_font_path: ''
  label_render: true
  label_pixels: 30.0
  label_min_pixels: 24.0
  label_max_ratio: 0.06
  label_color: '#FFFFFF'
  label_stroke_color: '#000000'
  label_adaptive_sampling: true
  label_fullframe_verify: true
animation:
  fps: 24
  walk_speed: 0.05
  run_speed: 0.1
  blend_frames: 6
dialogue:
  chinese_cps: 3.0
  english_wps: 2.5
  timing_source: script_first
  declared_tolerance_s: 0.2
  speech_rate:
    normal: 1.0
    angry: 1.15
    excited: 1.15
    urgent: 1.2
    sad: 0.8
    thinking: 0.85
    whisper: 0.9
delivery:
  preset: hd16x9
  appearance: clay
  render_backend: workbench
  video_codec: H264
  crf: MEDIUM
  export_depth: false
  export_camera_traj: false
  reference_cards: true
  mask_pass: true
  per_shot_clips: true
  full_concat: true
  external_ffmpeg_path: ''
  target_model: seedance_2.5
ui:
  show_axis: true
  show_composition: true
  show_safe_area: true
  show_labels: true
  enabled: true
  viewport_sprite: true
  web_auto_open: false
script_polish:
  enabled: false
  max_suggestions: 20
framing:
  headroom_policy: board
vlm_review:
  enabled: false
  max_shots: 0
guard:
  enabled: true
  preset: standard
  edge_clip_max: 0.1
  lead_room_min: 0.05
  sustain_frames: 12
  size_drift: 0.15
  jump_ratio: 0.25
  jump_cut_angle_deg: 30.0
  jump_cut_size_diff: 0.1
  occlusion_warn: 0.2
  sample_step: 4
  size_bands:
    head:
      MCU:
      - 0.45
      - 0.6
      CU:
      - 0.55
      - 0.75
      ECU:
      - 0.75
      - 1.0
    body:
      MS:
      - 0.55
      - 0.7
      MLS:
      - 0.7
      - 0.88
      LS:
      - 0.35
      - 0.6
      ELS:
      - 0.15
      - 0.35
rhythm:
  enabled: true
  pacing_profile: standard
  pace_frame_multiplier:
    slow: 1.35
    normal: 1.0
    brisk: 0.7
labels:
  adaptive_sampling: true
  fullframe_verify: true
ruler:
  enabled: false
  layer_weights:
    geometry: 0.25
    attention: 0.2
    action: 0.2
    continuity: 0.15
    cinema: 0.1
    robustness: 0.1
