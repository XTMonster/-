# BlockDirector sidecar 线协议（执行文档 v1.2 §2.5）
#
# 本文件是 sidecar 与插件之间的**唯一接口真源**。
# 其中的 schema 必须与 block_director/contracts/*.py 的数据类保持一致，
# 由 tests/test_openapi_matches_contracts.py 强制校验（§16.5 单一真源）。
openapi: 3.1.0
info:
  title: BlockDirector Sidecar API
  version: 1.3.0
  description: |
    LLM 与 RAG 的本地服务接口。仅监听 127.0.0.1。
    上层（driver）只依赖 LLMTransport 抽象，本协议是 sidecar 模式的实现细节。
servers:
  - url: http://127.0.0.1:8765
    description: 本机 sidecar（默认端口）

paths:
  /health:
    get:
      operationId: health
      summary: 健康检查与能力协商
      description: 插件启动时以 2s 超时探测；根据返回的 capabilities 决定 RAG 后端。
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 服务存在但依赖未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/chat:
    post:
      operationId: chat
      summary: 对话/工具调用（OpenAI 兼容子集）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: 模型回复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: 请求结构错误（映射为 E_LLM_002）
        "500":
          description: 上游模型错误（映射为 E_LLM_001）
        "504":
          description: 上游超时（映射为 E_LLM_001）

  /v1/embed:
    post:
      operationId: embed
      summary: 文本向量化（仅当 capabilities 含 vector 时可用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: 向量结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"

  /v1/retrieve:
    post:
      operationId: retrieve
      summary: 知识检索（BM25 或向量）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: 知识卡列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"

  /v1/cancel:
    post:
      operationId: cancel
      summary: 协作式取消（用户按 ESC 时调用）
      description: 与 driver 的 cancel_flag 对齐；服务端尽力中断在途请求。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: 已受理取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"

  # ---------------------------------------------------------------- UI（v1.7）
  /v1/ui/events:
    get:
      operationId: ui_events_list
      summary: 增量拉取运行状态事件（观察流）
      description: >-
        Web 端用 since=seq 增量拉。响应只含 seq > since 的事件。
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 只返回 seq 大于该值的事件
      responses:
        "200":
          description: 事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIEventListResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: ui_events_push
      summary: 推送一条运行状态事件
      description: >-
        客户端 seq/ts 一律忽略，seq/ts 由服务端赋值覆盖；kind 宽松读
        （state_change | shot_progress | llm_call | audit | chat | error）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UIEventPostRequest"
      responses:
        "200":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIEventPostResponse"
        "400":
          description: 事件结构非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/config:
    get:
      operationId: ui_config_get
      summary: 读取生效配置
      description: AppConfig.to_dict() 完整树；llm.api_key 已掩码。
      responses:
        "200":
          description: 配置树
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: ui_config_put
      summary: 写入配置
      description: >-
        请求体为 JSON 或 YAML；api_key 恒清空不落盘。error 级 issue → 400 拒写，
        磁盘文件不动；否则 200 且 issues 只含 warning。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPutRequest"
          application/yaml:
            schema:
              $ref: "#/components/schemas/ConfigPutRequest"
      responses:
        "200":
          description: 已写入（issues 可为空）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPutResponse"
        "400":
          description: error 级 issue 拒写或请求体非法
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ConfigPutResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/secret:
    put:
      operationId: ui_secret_put
      summary: 保存 provider 密钥
      description: 不回 key（R-UI-1）；响应里只允许出现 saved 标志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretPutRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPutResponse"
        "400":
          description: 空 api_key 等非法请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/knowledge/stats:
    get:
      operationId: ui_knowledge_stats
      summary: 知识库计数（cards / edges / cases）
      responses:
        "200":
          description: 计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeStatsResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/state_map:
    get:
      operationId: ui_state_map
      summary: 状态 → 助手形象映射
      description: dict(CLIP_BY_STATE)（contracts/assistant.py 单一真源）。
      responses:
        "200":
          description: 状态映射
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateMapResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/rules:
    get:
      operationId: ui_rules
      summary: 规则元信息目录
      description: rules 来自 rule_catalog.py（id/severity/summary）；disabled 每次请求重读。
      responses:
        "200":
          description: 规则目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/target_models:
    get:
      operationId: ui_target_models
      summary: 目标模型规格表
      responses:
        "200":
          description: 模型表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetModelsResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 规格表不可读/形态非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/shots:
    get:
      operationId: ui_shots
      summary: 读取某次运行的 shots.json
      parameters:
        - name: run
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
          description: 运行 id；非法 → 400，缺失 → 404
      responses:
        "200":
          description: shots.json 完整载荷
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotsResponse"
        "400":
          description: 非法 run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 运行不存在或 shots.json 缺失
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/chat:
    post:
      operationId: ui_chat
      summary: 只读小助手问答
      description: >-
        捷径/写保护分支响应带 source 键；走 LLM 检索分支只有 reply/sources。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUIRequest"
      responses:
        "200":
          description: 回复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUIResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/script/polish:
    post:
      operationId: ui_script_polish
      summary: Web 通道剧本优化（Stage P）
      description: >-
        {script} → {suggestions[], rewritten}。与 driver 的 run 内通道共用同一
        schema/模板/解析函数（contracts/script_polish.py 单一真源）。脚本为空
        → 400；上游失败或回复解析失败 → 502。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolishRequest"
      responses:
        "200":
          description: 优化建议与改写稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolishResponse"
        "400":
          description: 脚本为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 上游失败或回复解析失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/ui/script/polish/accept:
    post:
      operationId: ui_script_polish_accept
      summary: 采纳剧本优化改写稿
      description: >-
        {run_id} → 写回该 run 的 polish.json（accepted=true）。run 不存在 →
        404；写盘失败 → 500。采纳可能对下一次 run 生效（driver 不轮询中途
        accept），响应 note 如实说明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolishAcceptRequest"
      responses:
        "200":
          description: 已采纳
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolishAcceptResponse"
        "400":
          description: 缺 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: run 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: polish.json 写回失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /:
    get:
      operationId: ui_static_index
      summary: Web 前端首页
      description: 静态文件，免鉴权。web/ 白名单；`..` → 400。
      responses:
        "200":
          description: index.html
          content:
            text/html:
              schema:
                type: string
        "400":
          description: 非法路径
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /static/{path}:
    get:
      operationId: ui_static_asset
      summary: Web 静态资源
      description: >-
        静态文件，免鉴权。web/ 白名单；`..` → 400。content-type：
        .html/.js/.css/.png/.json/.txt。
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 资源内容
          content:
            application/octet-stream:
              schema:
                type: string
        "400":
          description: 非法路径
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 当配置 sidecar_token 时启用

  schemas:
    # ---------------------------------------------------------------- 会话
    FunctionCall:
      type: object
      required: [name, arguments]
      properties:
        name:
          type: string
          description: 工具名
        arguments:
          type: string
          description: JSON 字符串形式的参数（与 OpenAI 一致）

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
          description: assistant 消息与 tool 消息之间的唯一纽带（§3.4）
        type:
          type: string
          const: function
        function:
          $ref: "#/components/schemas/FunctionCall"

    Message:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          #: v1.5 §5.5（P6-T1）：与 contracts/messages.py::Message.content 同源。
          #: 纯文本是 string；vision 请求体是分片数组（text / image_url）。
          type: [string, array, "null"]
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [text, image_url]
              text:
                type: string
              image_url:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: >
                      图片地址；离线评审用 data:image/png;base64,… 内联。
        tool_calls:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ToolCall"
        tool_call_id:
          type: [string, "null"]
          description: role=tool 时必填，必须匹配此前 assistant.tool_calls 的 id
        name:
          type: [string, "null"]

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }

    ChatRequest:
      type: object
      required: [request_id, messages]
      properties:
        request_id:
          type: string
          description: 用于 /v1/cancel 定位
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        tools:
          type: array
          items:
            type: object
          description: JSON Schema 形式的工具定义
        tool_choice:
          type: string
          enum: [auto, required, none]
        temperature:
          type: number
          minimum: 0
          maximum: 2
        purpose:
          type: string
          enum: [understand, plan, editor, repair, react, review]
          description: 调用用途，用于预算核算与审计
        max_tokens:
          type: [integer, "null"]
          minimum: 1
        metadata:
          type: object
          description: |-
            厂商无关的调用元数据（可选）。当前唯一的使用者是"长分镜表分块出计划"：
            `plan_chunk` 记录这一问覆盖分镜表的哪一段（`index/total/start/stop`
            ＋原镜号）。模型看不到它；sidecar / 直连照原样忽略。空对象时不出现在报文里。
          additionalProperties: true

    ChatResponse:
      type: object
      properties:
        content:
          type: [string, "null"]
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        reasoning:
          type: [string, "null"]
          description: |
            思维链（qwen3 这类模型的 message.reasoning）。不是协议必需项，
            但排查"预算全花在思考上、没来得及调工具"时必须看得到。
        usage:
          oneOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
        request_id:
          type: [string, "null"]
        model:
          type: [string, "null"]
        finish_reason:
          type: [string, "null"]

    # ---------------------------------------------------------------- 检索
    Card:
      type: object
      required: [id, domain, title, content]
      properties:
        id: { type: string }
        domain: { type: string }
        title: { type: string }
        content: { type: string }
        keywords:
          type: array
          items: { type: string }
        rules:
          type: array
          items: { type: string }
        parameters:
          type: object
        examples:
          type: array
          items: { type: string }
        related:
          type: array
          items: { type: string }
        engine_support: { type: string }
        emotion: { type: string }
        tags:
          type: array
          items: { type: string }

    EmbedRequest:
      type: object
      required: [request_id, texts]
      properties:
        request_id: { type: string }
        texts:
          type: array
          items: { type: string }

    EmbedResponse:
      type: object
      required: [vectors, dim]
      properties:
        vectors:
          type: array
          items:
            type: array
            items: { type: number }
        dim: { type: integer, minimum: 1 }

    RetrieveRequest:
      type: object
      required: [request_id, query]
      properties:
        request_id: { type: string }
        query: { type: string }
        domain:
          type: [string, "null"]
          description: 限定知识域；null 表示全库检索
        top_k: { type: integer, minimum: 1 }
        cases_top_k:
          type: integer
          minimum: 1
          description: L3 参考案例条数（v1.4 §2.3b，默认 3，取 2–5）
        analogy_query:
          type: string
          description: >-
            v1.4 §2.3b 的类比查询（散文，走 L3 案例层）。留空 = 不查 L3；
            `query` 是约束串（`键=值`），恒走 L1/L2 —— 两通道各走各的，
            拿约束串去查 L3 会让"参考案例"那一栏全是噪声（实测 E1 = 0/24）。

    RetrieveResponse:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        edges:
          type: array
          description: >-
            L1/L2 超边（v1.4 §2.3）。**整条**返回，含全部 forbid 成员——
            绝不截断，否则模型会照样做禁忌动作。
          items:
            $ref: "#/components/schemas/HyperEdge"
        cases:
          type: array
          description: L3 参考案例（v1.4 §2.3b）。永不携带约束。
          items:
            $ref: "#/components/schemas/Case"
        trace:
          type: object
          description: >-
            v1.4 §2.3：knowledge_trace.json 的数据源（种子 / 扩展 / 逐条打分 /
            注入集合 / 后端 / 降级留痕 / 语料指纹）。只有 sidecar 算得出来，
            所以随响应一起返回。v3/S1a 起另带 `qualifiers`：**qualifier 闭集的
            惰性键表**——闭集里的每个名字都占一个键，值＝本次注入的边里真的用到
            的取值（没有则 null）。它是"这一代 schema 声明了哪些 qualifier"的
            唯一可观测面，也是 S1a 的验收谓词（键必须出现）。

    HyperEdge:
      type: object
      required: [edge_id, type]
      properties:
        edge_id: { type: string }
        type: { type: string }
        members:
          type: array
          description: "[role, kind, node_id] 三元组；role ∈ {allow, forbid, qualifier}"
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: { type: string }
        forbid:
          type: array
          description: members 中 role=forbid 的子集，单独列出以防漏读禁忌
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: { type: string }
        weight: { type: number }
        source_span: { type: object }
        source_kind: { type: string }
        hardness: { type: string }
        occurrences: { type: integer, minimum: 1 }
        confidence: { type: number }

    Case:
      type: object
      required: [case_id]
      properties:
        case_id: { type: string }
        case_type:
          type: string
          enum: [narrative, sequence_pattern, lesson]
        title: { type: string }
        excerpt: { type: string }
        beat_sequence:
          type: array
          items: { type: string }
        source_ref: { type: object }
        score: { type: number }

    # ---------------------------------------------------------------- 控制
    CancelRequest:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    CancelResponse:
      type: object
      required: [cancelled]
      properties:
        cancelled: { type: boolean }

    HealthResponse:
      type: object
      required: [status, version, capabilities]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [llm, bm25, vector, pdf, hypergraph]
          description: 能力协商依据（§2.5）
        detail:
          type: string

    # ---------------------------------------------------------------- UI（v1.7）
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UIEvent:
      type: object
      required: [seq, ts, kind, state, shot_id, payload]
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: number }
        kind:
          type: string
          description: state_change | shot_progress | llm_call | audit | chat | error（宽松读）
        state:
          type: string
          description: DriverState.value，kind=state_change 时必填
        shot_id:
          type: string
        payload:
          type: object
          additionalProperties: true

    UIEventPostRequest:
      type: object
      required: [seq, ts, kind]
      description: 请求体；seq/ts 由服务端覆盖，state/shot_id/payload 可选
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: number }
        kind: { type: string }
        state: { type: string }
        shot_id: { type: string }
        payload:
          type: object
          additionalProperties: true

    UIEventPostResponse:
      type: object
      required: [accepted, seq]
      properties:
        accepted: { type: boolean }
        seq: { type: integer, minimum: 0 }

    UIEventListResponse:
      type: object
      required: [events, latest_seq]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/UIEvent"
        latest_seq: { type: integer, minimum: 0 }

    Issue:
      type: object
      required: [code, field, severity, message]
      properties:
        code: { type: string }
        field: { type: string }
        severity:
          type: string
          enum: [error, warning]
        message: { type: string }

    ConfigPutRequest:
      type: object
      additionalProperties: true
      description: AppConfig.from_dict() 接受的配置子集（JSON 或 YAML）

    ConfigResponse:
      type: object
      additionalProperties: true
      description: AppConfig.to_dict() 完整树；llm.api_key 已掩码

    ConfigPutResponse:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
      description: 200（写入成功，issues 可为空）与 400（error 级拒写）共用

    SecretPutRequest:
      type: object
      required: [provider, api_key]
      properties:
        provider: { type: string }
        api_key: { type: string }

    SecretPutResponse:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }

    KnowledgeStatsResponse:
      type: object
      required: [cards, edges, cases, cards_note]
      properties:
        cards: { type: integer, minimum: 0 }
        edges: { type: integer, minimum: 0 }
        cases: { type: integer, minimum: 0 }
        cards_note: { type: string }

    StateMapResponse:
      type: object
      additionalProperties:
        type: string
      description: dict(CLIP_BY_STATE)——DriverState → 助手形象

    RuleInfo:
      type: object
      required: [id, severity, summary]
      properties:
        id: { type: string }
        severity:
          type: string
          enum: [error, warning]
        summary: { type: string }

    RulesResponse:
      type: object
      required: [rules, disabled]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleInfo"
        disabled:
          type: array
          items: { type: string }

    TargetModelsResponse:
      type: object
      required: [models, current]
      properties:
        models:
          type: object
          additionalProperties:
            type: object
            required: [label, raw]
            properties:
              label: { type: string }
              raw:
                type: object
                additionalProperties: true
        current: { type: string }

    ShotsResponse:
      type: object
      additionalProperties: true
      description: runs/<run>/export/shots.json 的完整载荷

    ChatUIRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ChatUIResponse:
      type: object
      required: [reply, sources]
      properties:
        reply: { type: string }
        source:
          type: string
          description: 捷径/写保护分支才带；LLM 检索分支没有该键
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type: { type: string }
              id: { type: string }

    PolishRequest:
      type: object
      required: [script]
      properties:
        script: { type: string }

    PolishResponse:
      type: object
      required: [suggestions, rewritten]
      properties:
        suggestions:
          type: array
          items: { type: string }
        rewritten: { type: string }

    PolishAcceptRequest:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }

    PolishAcceptResponse:
      type: object
      required: [accepted, note, run_id]
      properties:
        accepted: { type: boolean }
        note: { type: string }
        run_id: { type: string }
    #: D1 决策树投影 / 方案B 逐镜预演 / 数值层 的审计事件（wire 形状）。
    #: kind 枚举与 block_director/contracts/audit.py::V16_EVENT_FIELDS 的键
    #: 一致；事件字段集在 contracts/audit.py 单一真源，wire 协议只声明载荷
    #: 容器，不逐字段复制（防第二份真源漂移）。
    V16EventRecord:
      type: object
      required: [kind, data]
      properties:
        kind:
          type: string
          enum:
            - guard_warning
            - guard_verdict
            - retry_ladder
            - rhythm_reading
            - label_overlap_report
            - resume_checkpoint
            - resume_checkpoint_failed
            - wall_clock_exhausted
            - run_resumed
            - shot_resumed_skipped
            - vlm_capability
            - vlm_review_round
            - react_projected
            - repair_projected
            - draft_projected
            - projection_error
            - plan_adjusted
            - scene_prepared
            - shot_iteration
            - shot_advanced
            - opt_candidate
            - opt_result
            - opt_rejected
            - shot_version_saved
            - shot_version_restored
            - shot_version_restore_failed
            - adversarial_review
          description: 审计事件名，与 contracts/audit.py::V16_EVENT_FIELDS 的键一致
        message:
          type: [string, "null"]
          description: 人类可读说明（审计日志 message 字段）
        data:
          type: object
          additionalProperties: true
          description: 事件载荷；生产端必须携带 V16_EVENT_FIELDS[kind] 列出的全部键
